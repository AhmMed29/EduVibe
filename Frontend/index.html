<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVibe - Student Management System</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .hero {
            text-align: center;
            padding: 60px 20px;
        }
        .hero h1 {
            font-size: 48px;
            color: #1a1a2e;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 32px;
        }
        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .btn-secondary {
            padding: 14px 32px;
            background: white;
            color: #5b5fc7;
            border: 2px solid #5b5fc7;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: #f0f0ff;
        }
    </style>
</head>
<body>
<div class="hero">
    <h1>EduVibe</h1>
    <p>Student Management System</p>
    <div class="hero-buttons">
        <a href="pages/login.html" class="btn-primary">Sign In</a>
        <a href="pages/register.html" class="btn-secondary">Sign Up</a>
    </div>
</div>
</body>
</html>
