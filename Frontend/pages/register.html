<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EduVibe</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s;
        }
        .form-group select:focus {
            outline: none;
            border-color: #5b5fc7;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Create Account</h1>
        <p>Join EduVibe to get started</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="registerForm">
        <div class="form-row">
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" placeholder="Ahmed" required>
            </div>
            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Mohamed" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="01xxxxxxxxx">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
                <p class="form-hint">+8 chars, uppercase, lowercase, special (@, #, ..)</p>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
            </div>
        </div>

        <div class="form-group">
            <label for="role">Register as</label>
            <select id="role" required>
                <option value="Student" selected>Student</option>
                <option value="Instructor">Instructor</option>
            </select>
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div class="divider">
        <span>or continue with</span>
    </div>

    <div class="social-buttons">
        <button class="social-btn"><span>G</span></button>
        <button class="social-btn">GitHub</button>
    </div>

    <p class="signup-link">
        Already have an account? <a href="login.html">Sign In</a>
    </p>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const fname = document.getElementById("fname").value;
        const lname = document.getElementById("lname").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const role = document.getElementById("role").value;
        const errorMessage = document.getElementById("errorMessage");
        const submitBtn = document.querySelector(".btn-primary");

        errorMessage.style.display = "none";

        if (password !== confirmPassword) {
            errorMessage.textContent = "Passwords do not match.";
            errorMessage.style.display = "block";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
            const result = await AuthAPI.register({
                fname, lname, email, password, confirmPassword, phoneNumber: phone, role
            });

            if (result.accessToken) {
                saveToken(result);
                const roles = JSON.parse(localStorage.getItem("userRoles") || "[]");
                window.location.href = roles.includes("Admin") ? "/pages/admin.html" : "/pages/students.html";
            } else {
                errorMessage.textContent = result.message || "Registration failed";
                errorMessage.style.display = "block";
            }
        } catch (error) {
            errorMessage.textContent = "An error occurred. Please try again.";
            errorMessage.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
        }
    });
</script>
</body>
</html>
