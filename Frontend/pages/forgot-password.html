<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EduVibe</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .success-message {
            background: #f0fff4;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .btn-link {
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .back-link {
            text-align: center;
            margin-top: 16px;
        }
        .back-link a {
            color: #5b5fc7;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Forgot Password</h1>
        <p>Enter your account email and we'll send you a reset token</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>

    <div id="successSection" style="display: none;">
        <div class="success-message">
            <strong>Check your email!</strong><br>
            A reset token was sent to <span id="sentEmail"></span>. Copy it and continue to the next step.
        </div>
        <a href="reset-password.html" class="btn-primary btn-link">Continue to Reset Password</a>
        <p class="back-link"><a href="login.html">Back to Sign In</a></p>
    </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
    document.getElementById("forgotPasswordForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const errorMessage = document.getElementById("errorMessage");
        const submitBtn = document.querySelector(".btn-primary");

        errorMessage.style.display = "none";

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        try {
            const result = await AuthAPI.requestPasswordReset(email);

            if (result && result.status === 200) {
                document.getElementById("sentEmail").textContent = email;
                document.getElementById("forgotPasswordForm").style.display = "none";
                document.getElementById("successSection").style.display = "block";
            } else {
                errorMessage.textContent = (result && result.message) || "An error occurred. Please try again.";
                errorMessage.style.display = "block";
            }
        } catch (error) {
            errorMessage.textContent = "An error occurred. Please try again.";
            errorMessage.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Reset Link";
        }
    });
</script>
</body>
</html>
