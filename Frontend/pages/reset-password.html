<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - EduVibe</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .success-message {
            background: #f0fff4;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .btn-link {
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .form-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Reset Password</h1>
        <p>Enter the token from your email and choose a new password</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="resetPasswordForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="token">Reset Token</label>
            <input type="text" id="token" placeholder="Paste the token from your email" required>
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required>
            <p class="form-hint">+8 chars, uppercase, lowercase, special (@, #, ..)</p>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
        </div>

        <button type="submit" class="btn-primary">Reset Password</button>
    </form>

    <div id="successSection" style="display: none;">
        <div class="success-message">
            <strong>Password Reset Successfully!</strong><br>
            You can now sign in with your new password.
        </div>
        <a href="login.html" class="btn-primary btn-link">Back to Sign In</a>
    </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
    document.getElementById("resetPasswordForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const token = document.getElementById("token").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorMessage = document.getElementById("errorMessage");
        const submitBtn = document.querySelector(".btn-primary");

        errorMessage.style.display = "none";

        if (newPassword !== confirmPassword) {
            errorMessage.textContent = "Passwords do not match.";
            errorMessage.style.display = "block";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting...";

        try {
            const result = await AuthAPI.confirmReset(email, token, newPassword);

            if (result && result.status === 200) {
                document.getElementById("resetPasswordForm").style.display = "none";
                document.getElementById("successSection").style.display = "block";
            } else {
                errorMessage.textContent = (result && result.message) || "An error occurred. Please try again.";
                errorMessage.style.display = "block";
            }
        } catch (error) {
            errorMessage.textContent = "An error occurred. Please try again.";
            errorMessage.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset Password";
        }
    });
</script>
</body>
</html>
